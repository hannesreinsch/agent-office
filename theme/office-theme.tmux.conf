# office-theme.tmux.conf — optional. The look, separated from the behaviour.
#
#   source-file ~/code/agent-office/office.tmux.conf        # required
#   source-file ~/code/agent-office/theme/office-theme.tmux.conf   # this, if you want it
#
# Source it AFTER office.tmux.conf: it overrides the pane-border-format, and it
# keeps the two things office needs from that border (@office_num and the
# derived label), so the override is safe.
#
# The idea, in case you want to bend it: monochrome by conviction. State is
# TONE, WEIGHT and INVERSION, never hue. Exactly ONE colour is allowed on the
# bar, $ACCENT, and it means one thing only: something is waiting on you. If you
# find yourself wanting a second accent, what you actually want is $ALARM.

# --- the palette -------------------------------------------------------------
INK="#f6f5f1"       # primary text
MUTED="#9a9ca6"     # secondary
KICKER="#8a8d96"    # labels
DIM="#6a6c77"       # meta. The contrast floor for small text
FAINT="#4e505a"     # hairline furniture ONLY, never text
BAND="#0e1016"      # the bar
PANEL="#16181f"     # panels
ACTIVE="#2a2d36"    # a raised chip
ACCENT="#C9903F"    # the one signal colour. "this needs you"

# --- the bar -----------------------------------------------------------------
# Everything lives on the RIGHT. The left is deliberately quiet: that is where
# tmux draws the command prompt, and a logo is not worth the space you type in.
set -g status-position bottom
set -g status-justify right
set -g status-interval 5
set -g status-style "bg=$BAND,fg=$MUTED"

# ...except the keys, because a pane's border carries the chord that toggles it
# and that is no help once the pane is closed and the border went with it. The
# bar keeps the whole set and dims what is already open, so what is bright is
# what is missing. Clicking it opens a new session.
set -g status-left "#[range=user|task]#(~/code/agent-office/bin/office-bar '#{session_name}')#[norange] "
set -g status-left-length 70
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},user}' \
  { run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office desk' >/dev/null 2>&1 || true" } \
  { select-window -t= }

# Right: branch, then the clock. Point OFFICE_STATUS_CMD at any script that
# prints one line and it lands in front of them, refreshed every 5s. Mine
# prints whether my always-on stack is up and how many approvals are waiting.
set -g status-right-length 120
set -g status-right "#[fg=$INK,bold]#{?client_prefix,PREFIX  ,}#(test -n \"$OFFICE_STATUS_CMD\" && $OFFICE_STATUS_CMD '#{pane_current_path}')  #[fg=$KICKER]#(cd '#{pane_current_path}' 2>/dev/null && git branch --show-current 2>/dev/null)  #[fg=$FAINT]─ #[fg=$DIM]%H:%M #[fg=$KICKER]%d.%m "

# Windows. The name only earns its place once there is more than one office.
setw -g window-status-format "#[fg=$DIM] #W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[fg=$KICKER] #{?#{>:#{session_windows},1},#W,}#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=$INK,bold"

# --- panes -------------------------------------------------------------------
# Hairline borders. The active pane steps forward in tone, not in colour.
set -g pane-border-style "fg=$ACTIVE"
set -g pane-active-border-style "fg=$MUTED"
set -g pane-border-lines single
set -g pane-border-status top
# Keeps both things office needs: @office_num, and a label derived from
# pane_title so it cannot go stale. See office.tmux.conf for why that matters.
set -g pane-border-format "#[fg=#{?pane_active,$BAND,$KICKER},bg=#{?pane_active,$MUTED,$PANEL},bold] #{?@office_num,#{@office_num},#{pane_index}} #[fg=#{?pane_active,$INK,$KICKER},bg=$BAND,nobold] #{?@office_label,#{@office_label},#{pane_current_command}}#[fg=$DIM]#{?@office_key, #{@office_key},#{?@office_label, · #{=40:pane_title},}} "

# --- messages and modes ------------------------------------------------------
set -g message-style "bg=$PANEL,fg=$INK"
set -g message-command-style "bg=$PANEL,fg=$INK"
set -g mode-style "bg=$ACTIVE,fg=$INK"
set -g clock-mode-colour "$INK"
set -g clock-mode-style 24
set -g display-time 2000
