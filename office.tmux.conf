# office.tmux.conf — the tmux half of `office`.
#
#   source-file ~/path/to/office/office.tmux.conf
#
# Bindings and behaviour only. No colours: your theme stays yours. If you set
# pane-border-format yourself, set it AFTER sourcing this file and keep the
# @office_label / @office_kind bits, or the pane labels go blank.

# --- prefix ------------------------------------------------------------------
# Ctrl-Space, because Ctrl-b is a cursor key and Ctrl-a belongs to the shell.
# NOTE on macOS: "select the previous input source" also defaults to Ctrl-Space.
# With two keyboard layouts installed, turn that off or the prefix goes dead.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- core behaviour ----------------------------------------------------------
set -g mouse on                       # click a pane to focus it, drag a border
set -g history-limit 100000
set -sg escape-time 5                 # no lag when hitting Esc in an editor
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys emacs        # so Escape leaves a prompt instead of entering vi mode
set -g detach-on-destroy off
# keep the labels office sets; nothing else may rename panes or windows
set -g allow-rename off
setw -g automatic-rename off
set -g pane-border-status top

# --- true colour -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc"
set -ga terminal-features ",*:usstyle"

# =============================================================================
# THE KEYS. One scheme: Ctrl-Shift plus a key, no prefix.
#
#   Ctrl-Shift-arrows   move between panes
#   Ctrl-Shift-n        new Claude session   (left column)
#   Ctrl-Shift-t        the same (describe the task in Claude's own input)
#   Ctrl-Shift-a        toggle agent view    ) the right strip,
#   Ctrl-Shift-s        toggle shell         ) each one a toggle:
#   Ctrl-Shift-c        toggle chat          ) same key closes what it opened
#   Ctrl-Shift-e        toggle editor        )
#   Ctrl-Shift-w        close this pane      Ctrl-Shift-x  park it, still running
#   Ctrl-Shift-z        zoom this pane
#
# Arrows work anywhere. The LETTERS need iTerm2's key-translation layer
# (iterm/office-keys.json), because a terminal cannot encode Ctrl+Shift for a
# letter: Ctrl+Z and Ctrl+Shift+Z are the same byte on the wire. iTerm rewrites
# each chord to ESC+letter, which tmux reads as M-<letter>. Every one of them
# also works as Ctrl-Space then the same letter, with no iTerm involved.
# =============================================================================

# Retired schemes. `source-file` only ADDS bindings, so a live server keeps
# whatever it learned earlier: drop them by name or a reload resurrects them.
unbind -n M-Left ; unbind -n M-Right ; unbind -n M-Up ; unbind -n M-Down
unbind -n M-h ; unbind -n M-j ; unbind -n M-k ; unbind -n M-l
# Plain Shift-arrows stay unbound on purpose: editors select text with them.
unbind -n S-Left ; unbind -n S-Right ; unbind -n S-Up ; unbind -n S-Down

# Not Alt-arrows: iTerm's Natural Text Editing preset eats Alt-Left/Right as
# word-jump before tmux sees them. Not Ctrl-arrows: macOS keeps those for
# switching Spaces. Ctrl-Shift-arrows arrive as CSI 1;6 A-D, unclaimed.
bind -n C-S-Left  select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up    select-pane -U
bind -n C-S-Down  select-pane -D

# Every office command is silenced. Stray output from a keybinding makes tmux
# force the active pane into view-mode, where these chords all stop working.
bind -n M-n run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office desk'   >/dev/null 2>&1"
bind -n M-a run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office agents' >/dev/null 2>&1"
bind -n M-s run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office shell'  >/dev/null 2>&1"
bind -n M-c run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office chat'   >/dev/null 2>&1"
bind -n M-e run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office edit'   >/dev/null 2>&1"
bind -n M-x run-shell -b "zsh -ic 'office hide #{pane_id}'                       >/dev/null 2>&1"
# Ctrl-Shift-t is Ctrl-Shift-n: a new Claude session, focused, ready for you to
# describe the task in Claude's OWN input. It used to open a tmux prompt on the
# status bar, which was worse in three ways at once: tmux prompts take text and
# never an image or a dropped file, Escape does not reliably leave them, and you
# cannot move between them and a pane. A pane has none of those problems.
bind -n M-t run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office desk' >/dev/null 2>&1"
bind -n M-z resize-pane -Z
# w closes, x parks. Both ask nothing back except this one confirmation.
bind -n M-w confirm-before -p "close this pane? (y/n)" kill-pane

# --- the same things, with the prefix ----------------------------------------
bind n run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office desk'   >/dev/null 2>&1"
bind a run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office agents' >/dev/null 2>&1"
bind s run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office shell'  >/dev/null 2>&1"
bind c run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office chat'   >/dev/null 2>&1"
bind e run-shell -b "zsh -ic 'cd \"#{pane_current_path}\" && office edit'   >/dev/null 2>&1"
bind Z run-shell -b "zsh -ic 'office hide #{pane_id}'                       >/dev/null 2>&1"
bind t command-prompt -p "task:" 'run-shell -b "zsh -ic \"cd \\\"#{pane_current_path}\\\" && office task \\\"%%\\\"\" >/dev/null 2>&1"'
bind z resize-pane -Z
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind m set -g mouse \; display-message " mouse #{?mouse,on,off}"
bind r source-file ~/.tmux.conf \; display-message " config reloaded"
bind x confirm-before -p "close this pane? (y/n)" kill-pane
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
bind S choose-tree -Zs
bind Space last-window
unbind '"' ; unbind %

# --- copy mode (vi keys, system clipboard) -----------------------------------
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- pane borders ------------------------------------------------------------
# Two things office needs from the border, and a theme must preserve both:
#
#   @office_num    OUR pane number. tmux's own #{pane_index} follows the layout
#                  TREE, which join-pane leaves in an order the eye disagrees
#                  with. office numbers panes from their geometry instead.
#   the label      DERIVED, never simply trusted. Claude Code can move a
#                  conversation to the background and swap which pane shows the
#                  agent list, so a name pinned at startup starts lying, and you
#                  steer by it and wonder why the keys do nothing. #{pane_title}
#                  is what the pane is showing right now, so it wins.
set -g pane-border-lines single
set -g pane-border-format " #{?@office_num,#{@office_num},#{pane_index}} #{?#{==:#{pane_title},claude agents},AGENT VIEW,#{?@office_label,#{@office_label},#{pane_current_command}}}#{?#{==:#{pane_title},claude agents},,#{?@office_label, · #{=40:pane_title},}} "

# --- the text cursor ---------------------------------------------------------
# tmux owns the cursor shape inside a session, so a terminal-profile setting is
# quietly ignored in here. An app that emits its own DECSCUSR still wins.
setw -g cursor-style blinking-underline
